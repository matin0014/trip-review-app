<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><title>Trip Review</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-polylinedecorator@1.6.0/dist/leaflet.polylineDecorator.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
 :root{
  --paper-0:#fff;--paper-50:#f7f8fa;--paper-100:#eef1f5;--paper-200:#e2e6ec;--paper-300:#cdd4df;
  --slate-500:#798498;--ink-600:#586275;--ink-800:#28303f;--ink-900:#161d2a;--ink-950:#0d1119;
  --cobalt-50:#eef3fe;--cobalt-100:#d8e4fd;--cobalt-500:#2457d6;--cobalt-600:#1c46b4;
  --ok:#138a72;
  --sans:'IBM Plex Sans',system-ui,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --panel-w:300px;--insp-w:336px;--toolbar-h:52px;
 }
 *{box-sizing:border-box}
 html,body{height:100%;margin:0}
 body{font-family:var(--sans);color:var(--ink-800);background:var(--paper-50)}
 .mono{font-family:var(--mono);font-feature-settings:"tnum" 1,"zero" 1}
 .app{display:flex;flex-direction:column;height:100%}
 .app__body{flex:1 1 auto;display:flex;min-height:0}

 /* top bar */
 .topbar{flex:0 0 var(--toolbar-h);height:var(--toolbar-h);display:flex;align-items:center;justify-content:space-between;
   padding:0 16px;background:var(--ink-950);color:#fff}
 .brand{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:600;letter-spacing:-.01em}
 .brand .dot{width:10px;height:10px;border-radius:3px;background:var(--cobalt-500)}
 .crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:rgba(255,255,255,.72)}
 .crumb .sep{color:rgba(255,255,255,.3)}
 .crumb .mono{font-size:12px;color:#fff}
 .topbar__right{font-family:var(--mono);font-size:11px;color:rgba(255,255,255,.45)}

 /* rails */
 .rail{flex:0 0 var(--panel-w);width:var(--panel-w);background:var(--paper-0);border-right:1px solid var(--paper-300);
   overflow-y:auto;padding:18px 16px}
 .insp{flex:0 0 var(--insp-w);width:var(--insp-w);background:var(--paper-0);border-left:1px solid var(--paper-300);overflow-y:auto}
 .app__map{position:relative;flex:1 1 auto;min-width:0}
 #map{position:absolute;inset:0}
 .leaflet-container{background:#e8ebf0;font-family:var(--sans)}

 .overline{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--slate-500);
   margin:20px 0 8px;display:flex;align-items:baseline;justify-content:space-between}
 .overline:first-child{margin-top:0}
 .overline .aux{font-family:var(--mono);font-size:11px;color:var(--slate-500);font-weight:500;letter-spacing:0}
 select{width:100%;padding:6px 8px;border:1px solid var(--paper-300);border-radius:7px;background:var(--paper-0);
   font-family:var(--sans);font-size:13px;color:var(--ink-800)}
 select:focus{outline:none;border-color:var(--cobalt-500);box-shadow:0 0 0 3px var(--focus-ring,rgba(36,87,214,.25))}
 .lyr{display:flex;align-items:center;gap:9px;font-size:13px;padding:4px 0;cursor:pointer;color:var(--ink-800)}
 .lyr input{accent-color:var(--cobalt-500)}

 .legend{border-top:1px solid var(--paper-200);padding-top:12px}
 .ft{margin-bottom:11px}
 .ft .desc{color:var(--ink-600);font-size:12px;margin-top:3px;line-height:1.3}
 .pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:600;color:#fff;letter-spacing:.01em}
 .summary{margin-top:18px;font-family:var(--mono);font-size:11px;color:var(--slate-500);line-height:1.5;
   border-top:1px solid var(--paper-200);padding-top:12px}

 /* floating map chrome */
 .phasenote{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:400;
   background:rgba(255,255,255,.92);backdrop-filter:blur(8px);box-shadow:0 4px 16px rgba(13,17,25,.12);
   border-radius:999px;padding:6px 16px;font-size:12px;color:var(--ink-800)}
 .phasenote b{color:var(--cobalt-600);font-weight:600}

 /* inspector */
 .insp-hint{display:flex;gap:9px;margin:14px;padding:10px 12px;background:var(--cobalt-50);
   border:1px solid var(--cobalt-100);border-radius:7px;font-size:12px;color:var(--ink-800);line-height:1.3}
 .insp-hint .ic{color:var(--cobalt-500);flex:0 0 auto;font-weight:700}
 .insp-sec{padding:6px 14px 0}
 .tools{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin:6px 14px 8px}
 .tools button{border:1px solid var(--paper-300);background:var(--paper-0);border-radius:6px;padding:3px 9px;
   font-family:var(--mono);font-size:12px;color:var(--ink-600);cursor:pointer}
 .tools button:hover{background:var(--paper-100);color:var(--ink-900)}
 .tools .sp{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--slate-500)}
 .tools .rng{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-600)}
 .tools .rng input{width:40px;padding:3px 4px;border:1px solid var(--paper-300);border-radius:6px;font-family:var(--mono);font-size:12px;text-align:center}

 .row{padding:11px 14px;border-bottom:1px solid var(--paper-200);cursor:pointer;transition:background .12s}
 .row:hover{background:var(--paper-100)}
 .row.sel{background:var(--cobalt-50);box-shadow:inset 3px 0 0 var(--cobalt-500)}
 .row.hidden{opacity:.45}
 .row__head{display:flex;align-items:center;gap:10px}
 .node{flex:0 0 auto;width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
   font-family:var(--mono);font-weight:600;font-size:12px;color:#fff;box-shadow:0 1px 2px rgba(13,17,25,.3)}
 .row__main{flex:1 1 auto;min-width:0}
 .row__time{font-size:13px;color:var(--ink-950);display:flex;align-items:center;gap:7px}
 .row__sub{font-size:12px;color:var(--ink-600);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .vis{margin-left:auto;flex:0 0 auto;width:13px;height:13px;border-radius:50%;border:1.5px solid var(--paper-400,#a6afc0);cursor:pointer}
 .vis.on{background:var(--cobalt-500);border-color:var(--cobalt-500)}
 .logged{font-family:var(--mono);font-size:10px;font-weight:600;background:var(--ink-900);color:#fff;border-radius:999px;padding:1px 7px;letter-spacing:.02em}
 .detail{margin-top:10px;padding-top:4px}
 .drow{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;font-size:13px;border-top:1px solid var(--paper-200)}
 .drow .k{color:var(--ink-600)}
 .drow .v{font-family:var(--mono);color:var(--ink-950);text-align:right}

 .flagrow{padding:11px 14px;border-bottom:1px solid var(--paper-200)}
 .flagrow__top{display:flex;align-items:center;gap:7px}
 .status{margin-left:auto;font-family:var(--mono);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
 .status.pending{color:var(--slate-500)}.status.accepted{color:var(--ok)}.status.waived{color:#b42318}
 .ev{font-family:var(--mono);font-size:12px;color:var(--ink-600);margin-top:5px}
 .empty{padding:14px;color:var(--slate-500);font-size:12px}
 #resolved .flagrow{opacity:.7}
 .flag-actions{display:flex;gap:6px;margin-top:9px}
 .act{font-family:var(--sans);font-size:12px;font-weight:500;border:1px solid var(--paper-300);background:var(--paper-0);color:var(--ink-700);border-radius:6px;padding:4px 13px;cursor:pointer}
 .act:hover{background:var(--paper-100)}
 .act.on{background:var(--cobalt-500);border-color:var(--cobalt-500);color:#fff}
 .act.on.waive{background:var(--ink-700);border-color:var(--ink-700)}
 .rewind button{border:1px solid var(--paper-300);background:var(--paper-0);border-radius:6px;padding:2px 9px;
   font-family:var(--sans);font-size:11px;font-weight:500;color:var(--ink-600);cursor:pointer;margin-left:5px;text-transform:none;letter-spacing:0}
 .rewind button:hover{background:var(--paper-100);color:var(--ink-900)}

 /* leaflet bits */
 .leaflet-div-icon{background:transparent;border:0}
 .flabel{display:inline-block;font-family:var(--sans);font-size:10px;font-weight:600;color:#fff;padding:2px 7px;
   border-radius:999px;white-space:nowrap;box-shadow:0 1px 3px rgba(13,17,25,.4);transform:translate(-50%,-150%)}
 .mapnode{font-family:var(--mono);font-weight:600;font-size:11px;color:#fff;width:22px;height:22px;border-radius:50%;
   display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(13,17,25,.45)}
</style></head><body>
<div class="app">
 <header class="topbar">
  <div class="brand"><span class="dot"></span>Trip Review</div>
  <div class="crumb" id="crumb"></div>
  <div class="topbar__right" id="dataset"></div>
 </header>
 <div class="app__body">
  <aside class="rail">
   <div class="overline">Participant <span class="aux" id="pcount"></span></div>
   <select id="person"></select>
   <div class="overline">Date</div>
   <select id="day"></select>
   <div class="overline">Layers</div>
   <label class="lyr"><input type="checkbox" id="lyTrips" checked> Trip lines</label>
   <label class="lyr"><input type="checkbox" id="lyStraight"> Straight lines (start to end)</label>
   <label class="lyr"><input type="checkbox" id="lyFlags" checked> Problem flags</label>
   <label class="lyr"><input type="checkbox" id="lyEnds" checked> Endpoints</label>
   <div class="overline">On this day</div>
   <div class="legend" id="legend"></div>
   <div class="summary" id="summary"></div>
  </aside>
  <div class="app__map">
   <div id="map"></div>
   <div class="phasenote">Live projection · <b>read-only</b> preview</div>
  </div>
  <aside class="insp">
   <div class="insp-hint"><span class="ic">⚠</span><span>Flags show their current status. Accept / waive arrives next — this view already reflects the live projection.</span></div>
   <div class="overline insp-sec">Trips <span class="aux" id="tcount"></span></div>
   <div class="tools">
    <button id="bNone">None</button>
    <span class="rng">Show <input id="rFrom" type="number" min="1"> – <input id="rTo" type="number" min="1"></span>
    <button id="bAll">All</button>
    <span class="sp" id="nShown"></span>
   </div>
   <div id="trips"></div>
   <div class="overline insp-sec">
    <span>Flags <span class="aux" id="fcount"></span></span>
    <span class="rewind"><button id="bUndo">Undo</button><button id="bRedo">Redo</button></span>
   </div>
   <div id="flags"></div>
   <div class="overline insp-sec" id="resolvedHead" style="display:none">
    <span>Resolved <span class="aux" id="rcount"></span></span>
    <span class="rewind"><button id="bResolvedToggle">Show</button></span>
   </div>
   <div id="resolved" style="display:none"></div>
  </aside>
 </div>
</div>
<script>
const SID="{{ sid }}";
const FC={fragment:'#c2479e',mode_change:'#8e44ad',missing_trip:'#2c6fb3',missing_activity:'#e07b1a',zero_move:'#138a72'};
const FNAME={fragment:'Fragment',mode_change:'Mode change',missing_trip:'Missing trip',missing_activity:'Missing activity',zero_move:'Zero-move'};
const FDESC={fragment:'The app split one drive into pieces.',mode_change:'Different speed classes — kept separate.',
 missing_trip:'A real trip looks absent in the gap.',missing_activity:'A longer gap — an unlogged stop.',zero_move:'Logged trip that barely moved.'};
const APPLY_VERB={fragment:'Accept',missing_trip:'Accept',zero_move:'Accept',missing_activity:'Reviewed',mode_change:'Merge'};
const APPLY_DONE={fragment:'Accepted',missing_trip:'Accepted',zero_move:'Accepted',missing_activity:'Reviewed',mode_change:'Merged'};
const APPLY_RES={fragment:'accept',missing_trip:'accept',zero_move:'accept',missing_activity:'reviewed',mode_change:'merge'};
const TC=["#e41a1c","#377eb8","#4daf4a","#984ea3","#ff7f00","#00bcd4","#a65628","#f781bf","#666633","#0d6b58","#b8860b","#7b68ee"];
const STRAIGHT_COL="#3d4759";   // straight start→end view: all trips one neutral colour
const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function weekday(s){const a=s.split('-').map(Number);return WD[new Date(a[0],a[1]-1,a[2]).getDay()];}

const map=L.map('map',{zoomControl:true}).setView([49.26,-123.1],12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
let layer=L.layerGroup().addTo(map);

const personSel=document.getElementById('person'),daySel=document.getElementById('day');
const lyTrips=document.getElementById('lyTrips'),lyStraight=document.getElementById('lyStraight'),
      lyFlags=document.getElementById('lyFlags'),lyEnds=document.getElementById('lyEnds');
const tripsEl=document.getElementById('trips'),flagsEl=document.getElementById('flags'),legendEl=document.getElementById('legend');
const rFrom=document.getElementById('rFrom'),rTo=document.getElementById('rTo');

let byPerson={},cur={person:null,key:null,data:null},hidden=new Set(),sel=null,resolvedOpen=false;

fetch(`/api/${SID}/days`).then(r=>r.json()).then(d=>{
 const c=d.counts;
 document.getElementById('dataset').textContent=`${d.raw_name}`;
 document.getElementById('summary').textContent=`${c.trips} trips · ${c.flags} flags\n${c.persons} people · ${c.person_days} person-days`;
 byPerson={};
 d.days.forEach(x=>(byPerson[x.person]=byPerson[x.person]||[]).push(x));
 const ps=Object.keys(byPerson).sort();
 document.getElementById('pcount').textContent=ps.length+' total';
 ps.forEach(p=>personSel.add(new Option(`${p}  (${byPerson[p].length}d)`,p)));
 cur.person=ps[0];personSel.value=cur.person;fillDays();
});

function fillDays(){
 daySel.innerHTML='';
 byPerson[cur.person].slice().sort((a,b)=>a.date<b.date?-1:1).forEach(x=>
   daySel.add(new Option(`${x.date} · ${weekday(x.date)}`+(x.n_flags?`  ⚠${x.n_flags}`:''),x.key)));
 cur.key=daySel.value;loadDay();
}
// keep=true preserves the current show/hide + selection across a decision
// (a fresh day load resets them). fit=true re-frames the map (day/person switch).
function loadDay(fit=true,keep=false){
 if(!keep){hidden=new Set();sel=null;resolvedOpen=false;}
 fetch(`/api/${SID}/live-day?key=`+encodeURIComponent(cur.key)).then(r=>r.json()).then(d=>{
  cur.data=d;
  if(keep){const T=d.trips.length;hidden=new Set([...hidden].filter(s=>s<=T));if(sel!=null&&sel>T)sel=null;}
  else{rFrom.value=1;rTo.value=d.trips.length;}
  document.getElementById('crumb').innerHTML=`<span class="mono">${cur.person}</span><span class="sep">/</span>`+
    `<span class="mono">${cur.key.split('|')[1]}</span><span class="sep">·</span>${d.trips.length} trips`;
  render(fit);   // fit only on a fresh day load, never after an action
 });
}
function tcol(seq){return TC[(seq-1)%TC.length];}
function setRange(a,b){
 const T=cur.data.trips.length;
 a=Math.max(1,Math.min(T,a||1)); b=Math.max(a,Math.min(T,b||T));
 hidden=new Set();cur.data.trips.forEach(t=>{if(t.seq<a||t.seq>b)hidden.add(t.seq);});
 rFrom.value=a;rTo.value=b;render();
}
function showNone(){hidden=new Set(cur.data.trips.map(t=>t.seq));rFrom.value='';rTo.value='';render();}

function evLine(e){
 if(e.median_speed_kmh!=null)return `${e.displacement_m!=null?e.displacement_m+' m':''}${e.median_speed_kmh!=null?' · '+e.median_speed_kmh+' km/h':''}`;
 let s=[];
 if(e.gap_distance_m!=null)s.push(e.gap_distance_m+' m');
 if(e.gap_time_min!=null)s.push(e.gap_time_min+' min');
 if(e.v_a_kmh!=null)s.push(e.v_a_kmh+(e.v_b_kmh!=null?'→'+e.v_b_kmh:'')+' km/h');
 if(e.residual_min!=null)s.push('resid '+e.residual_min+(e.buffer_min!=null?'/buf '+e.buffer_min:''));
 return s.join(' · ');
}

function addArrows(pl,color){
 const straight=lyStraight.checked;
 L.polylineDecorator(pl,{patterns:[{
   offset:straight?'50%':25, repeat:straight?0:120,
   symbol:L.Symbol.arrowHead({pixelSize:11,polygon:false,pathOptions:{stroke:true,weight:2,color:color,opacity:.95}})
 }]}).addTo(layer);
}

// full render: redraw the map AND rebuild the inspector panels
function render(fit){
 if(!cur.data)return;
 drawMap(fit);
 renderTrips();renderFlags();renderLegend();
}
// map only — used on pan/zoom so the inspector panels are left untouched
function drawMap(fit){
 const d=cur.data;if(!d)return;
 layer.clearLayers();
 const byseq={};d.trips.forEach(t=>byseq[t.seq]=t);
 const pts=[];
 d.trips.forEach(t=>{
  if(hidden.has(t.seq))return;
  const col=lyStraight.checked?STRAIGHT_COL:tcol(t.seq);
  if(lyTrips.checked){
   const line=lyStraight.checked?[t.s,t.e]:t.route;
   const pl=L.polyline(line,{color:col,weight:t.seq===sel?6:4,opacity:t.seq===sel?1:.85}).addTo(layer);
   addArrows(pl,col);
   line.forEach(p=>pts.push(p));
  }
  if(lyEnds.checked){
   L.marker(t.s,{icon:L.divIcon({className:'',iconSize:[22,22],html:`<div class="mapnode" style="background:${col}">${t.seq}</div>`})})
     .addTo(layer).on('click',()=>{sel=t.seq;render();});
   L.circleMarker(t.e,{radius:5,color:col,weight:2,fillColor:'#fff',fillOpacity:1}).addTo(layer);
  }
 });
 if(fit&&pts.length)map.fitBounds(pts,{padding:[50,50]});
 if(lyFlags.checked){
  const bnds=map.getBounds();   // only flags whose trips are in the current viewport
  d.flags.forEach(f=>{
   if(f.status!=='pending')return;   // decided flags (accepted/reviewed/waived) leave the map
   const col=FC[f.type]||'#000',sq=f.seqs.filter(x=>x!=null);let mid;
   if(f.type==='zero_move'){
    const t=byseq[sq[0]];if(!t||hidden.has(t.seq)||!bnds.contains(t.s))return;
    L.circleMarker(t.s,{radius:12,color:col,weight:3,dashArray:'4',fill:false}).addTo(layer);mid=t.s;
   }else{
    const a=byseq[sq[0]],b=byseq[sq[1]];
    if(!a||!b||hidden.has(a.seq)||hidden.has(b.seq))return;
    if(!bnds.contains(a.e)&&!bnds.contains(b.s))return;
    L.polyline([a.e,b.s],{color:col,weight:3,dashArray:'8,6'}).addTo(layer);
    mid=[(a.e[0]+b.s[0])/2,(a.e[1]+b.s[1])/2];
   }
   L.marker(mid,{interactive:false,icon:L.divIcon({className:'',iconSize:null,html:`<div class="flabel" style="background:${col}">${FNAME[f.type]}</div>`})}).addTo(layer);
  });
 }
}
map.on('moveend',()=>{if(cur.data)drawMap(false);});

function renderTrips(){
 const d=cur.data;tripsEl.innerHTML='';
 document.getElementById('tcount').textContent=d.trips.length;
 document.getElementById('nShown').textContent=(d.trips.length-hidden.size)+' / '+d.trips.length+' shown';
 d.trips.forEach(t=>{
  const card=document.createElement('div');
  card.className='row'+(t.seq===sel?' sel':'')+(hidden.has(t.seq)?' hidden':'');
  const logged=t.manual?`<span class="logged">logged</span>`:'';
  card.innerHTML=`<div class="row__head">`+
   `<span class="node" style="background:${tcol(t.seq)}">${t.seq}</span>`+
   `<div class="row__main"><div class="row__time"><span class="mono">${t.start}–${t.end}</span>${logged}`+
   `<span class="mono" style="color:var(--slate-500)">${t.dur}m</span></div>`+
   `<div class="row__sub">${t.mode}${t.purpose?' · '+t.purpose:''}</div></div>`+
   `<span class="vis${hidden.has(t.seq)?'':' on'}" title="Show/hide on map"></span></div>`+
   (t.seq===sel?detailHTML(t):'');
  card.querySelector('.vis').onclick=e=>{e.stopPropagation();hidden.has(t.seq)?hidden.delete(t.seq):hidden.add(t.seq);render();};
  card.onclick=()=>{sel=(sel===t.seq?null:t.seq);render();};
  tripsEl.appendChild(card);
 });
}

function detailHTML(t){
 const rows=[['Start',t.start],['End',t.end],['Duration',t.dur+' min'],
  ['Mode',t.mode],['Purpose',t.purpose||'—'],
  ['Speed',t.speed!=null?t.speed+' km/h':'—'],
  ['Origin',t.s[0]+', '+t.s[1]]];
 return `<div class="detail">`+rows.map(([k,v])=>`<div class="drow"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('')+`</div>`;
}

function flagCard(f){
 const sq=f.seqs.filter(x=>x!=null).map(s=>'#'+s).join(', ');
 const applyRes=APPLY_RES[f.type]||'accept';
 const acc=f.status==='accepted', wv=f.status==='waived';
 const card=document.createElement('div');card.className='flagrow';
 card.innerHTML=`<div class="flagrow__top"><span class="pill" style="background:${FC[f.type]}">${FNAME[f.type]}</span>`+
  `<span class="mono" style="font-size:11px;color:var(--slate-500)">${sq}</span>`+
  `<span class="status ${f.status}">${f.status}</span></div><div class="ev">${evLine(f.ev||{})}</div>`+
  `<div class="flag-actions">`+
    `<button class="act apply${acc?' on':''}" title="${acc?'Click to undo':''}">${acc?APPLY_DONE[f.type]:APPLY_VERB[f.type]}</button>`+
    `<button class="act waive${wv?' on waive':''}" title="${wv?'Click to undo':''}">${wv?'Waived':'Waive'}</button></div>`;
 card.querySelector('.apply').onclick=()=>decide(f.id, acc?'clear':applyRes);
 card.querySelector('.waive').onclick=()=>decide(f.id, wv?'clear':'waive');
 return card;
}

function renderFlags(){
 const d=cur.data;
 const pend=d.flags.filter(f=>f.status==='pending');
 const res=d.flags.filter(f=>f.status!=='pending');
 document.getElementById('fcount').textContent=pend.length;
 flagsEl.innerHTML='';
 if(!pend.length) flagsEl.innerHTML='<div class="empty">No pending flags.</div>';
 else pend.forEach(f=>flagsEl.appendChild(flagCard(f)));

 const head=document.getElementById('resolvedHead'), rEl=document.getElementById('resolved');
 if(res.length){
  head.style.display='';
  document.getElementById('rcount').textContent=res.length;
  document.getElementById('bResolvedToggle').textContent=resolvedOpen?'Hide':'Show';
  rEl.style.display=resolvedOpen?'':'none';
  rEl.innerHTML='';
  if(resolvedOpen) res.forEach(f=>rEl.appendChild(flagCard(f)));
 }else{
  head.style.display='none'; rEl.style.display='none'; rEl.innerHTML='';
 }
}

function decide(flagId,resolution){
 fetch(`/api/${SID}/decision`,{method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({flag_id:flagId,resolution})}).then(()=>loadDay(false,true));
}
function rewind(path){fetch(`/api/${SID}/${path}`,{method:'POST'}).then(()=>loadDay(false,true));}

function renderLegend(){
 const types=[...new Set(cur.data.flags.map(f=>f.type))];
 legendEl.innerHTML=types.length?types.map(ty=>
   `<div class="ft"><span class="pill" style="background:${FC[ty]}">${FNAME[ty]}</span><div class="desc">${FDESC[ty]}</div></div>`).join('')
   :'<div class="empty" style="padding:0">No flags on this day.</div>';
}

personSel.onchange=()=>{cur.person=personSel.value;fillDays();};
daySel.onchange=()=>{cur.key=daySel.value;loadDay();};
[lyTrips,lyStraight,lyFlags,lyEnds].forEach(c=>c.onchange=render);
document.getElementById('bUndo').onclick=()=>rewind('undo');
document.getElementById('bRedo').onclick=()=>rewind('redo');
document.getElementById('bResolvedToggle').onclick=()=>{resolvedOpen=!resolvedOpen;renderFlags();};
document.getElementById('bNone').onclick=()=>showNone();
document.getElementById('bAll').onclick=()=>setRange(1,cur.data.trips.length);
rFrom.onchange=()=>setRange(parseInt(rFrom.value),parseInt(rTo.value));
rTo.onchange=()=>setRange(parseInt(rFrom.value),parseInt(rTo.value));
</script>
</body></html>
