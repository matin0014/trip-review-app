<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><title>Trip Review Tool — proposals</title>
<style>
 *{box-sizing:border-box}
 body{font-family:system-ui,Segoe UI,sans-serif;margin:0;color:#1f2430;display:flex;height:100vh;overflow:hidden}
 #left{width:300px;border-right:1px solid #e4e7ec;overflow-y:auto;padding:14px 16px;flex:0 0 auto}
 #main{flex:1 1 auto;overflow-y:auto;padding:18px 22px}
 h2{font-size:16px;margin:0 0 2px}
 .muted{color:#98a2b3;font-size:12px}
 .note{background:#fffbe9;border:1px solid #f4e4a8;color:#7a5b00;border-radius:8px;
       padding:8px 10px;font-size:12px;margin:10px 0 16px}
 .day{padding:7px 9px;border-radius:7px;cursor:pointer;font-size:13px;display:flex;gap:8px;align-items:center}
 .day:hover{background:#f5f7fa}
 .day.sel{background:#eef4ff}
 .day .fl{margin-left:auto;font-size:11px;color:#fff;background:#ef4444;border-radius:9px;padding:0 7px}
 .day .fl.zero{display:none}
 table{border-collapse:collapse;width:100%;font-size:13px;margin-bottom:24px}
 th,td{text-align:left;padding:5px 9px;border-bottom:1px solid #eef0f3}
 th{color:#667085;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
 .chip{display:inline-block;border-radius:10px;padding:1px 8px;font-size:11px;font-weight:600;color:#fff}
 code{background:#f2f4f7;padding:1px 5px;border-radius:5px;font-size:12px}
</style></head><body>
<div id="left">
 <h2>Person-days</h2>
 <div class="muted" id="summary"></div>
 <div id="days" style="margin-top:10px"></div>
</div>
<div id="main">
 <div class="note">Stage 4 · part 1 — proposals are loaded and served. Review actions
  (accept / waive, cascade, manual edits) come in later parts.</div>
 <div id="detail" class="muted">Select a person-day on the left.</div>
</div>
<script>
const SID="{{ sid }}";
const FC={fragment:'#f59e0b',mode_change:'#8b5cf6',missing_trip:'#ef4444',missing_activity:'#3b82f6',zero_move:'#10b981'};
const FNAME={fragment:'Fragment',mode_change:'Mode change',missing_trip:'Missing trip',missing_activity:'Missing activity',zero_move:'Zero-move'};
const daysEl=document.getElementById('days'), detail=document.getElementById('detail');
let sel=null;

fetch(`/api/${SID}/days`).then(r=>r.json()).then(d=>{
 const c=d.counts;
 document.getElementById('summary').textContent=
   `${d.raw_name} · ${c.trips} trips · ${c.flags} flags · ${c.persons} people · ${c.person_days} person-days`;
 d.days.forEach(day=>{
  const el=document.createElement('div'); el.className='day';
  el.innerHTML=`<span>${day.person}</span><span class="muted">${day.date}</span>`+
    `<span class="fl ${day.n_flags?'':'zero'}">${day.n_flags}</span>`;
  el.onclick=()=>{document.querySelectorAll('.day').forEach(x=>x.classList.remove('sel'));
    el.classList.add('sel'); load(day.key);};
  daysEl.appendChild(el);
 });
});

function ev(e){
 if(e.median_speed_kmh!=null) return `${e.displacement_m??'?'} m · ${e.median_speed_kmh} km/h moving`;
 let s=[];
 if(e.gap_distance_m!=null)s.push(e.gap_distance_m+' m');
 if(e.gap_time_min!=null)s.push(e.gap_time_min+' min');
 if(e.v_a_kmh!=null)s.push(e.v_a_kmh+(e.v_b_kmh!=null?'→'+e.v_b_kmh:'')+' km/h');
 if(e.residual_min!=null)s.push('resid '+e.residual_min+(e.buffer_min!=null?'/buf '+e.buffer_min:''));
 return s.join(' · ');
}

function load(key){
 fetch(`/api/${SID}/day?key=`+encodeURIComponent(key)).then(r=>r.json()).then(day=>{
  let h=`<h2>${day.person} · ${day.date}</h2>`+
        `<div class="muted">${day.trips.length} trips · ${day.flags.length} flags</div>`;
  h+='<h3>Trips</h3><table><tr><th>#</th><th>Time</th><th>Dur</th><th>Mode</th><th>Purpose</th><th>Pts</th></tr>';
  day.trips.forEach(t=>h+=`<tr><td>${t.seq}</td><td>${t.start}–${t.end}</td><td>${t.dur} min</td>`+
        `<td>${t.mode}</td><td>${t.purpose||'<span class="muted">—</span>'}</td><td>${t.route.length}</td></tr>`);
  h+='</table>';
  if(day.flags.length){
   h+='<h3>Flags</h3><table><tr><th>Type</th><th>Trips</th><th>Evidence</th><th>Id</th></tr>';
   day.flags.forEach(f=>h+=`<tr><td><span class="chip" style="background:${FC[f.type]}">${FNAME[f.type]}</span></td>`+
        `<td>${f.seqs.filter(x=>x!=null).map(s=>'#'+s).join(', ')}</td>`+
        `<td>${ev(f.ev||{})}</td><td><code>${f.id.slice(0,8)}</code></td></tr>`);
   h+='</table>';
  }
  detail.className=''; detail.innerHTML=h;
 });
}
</script>
</body></html>
