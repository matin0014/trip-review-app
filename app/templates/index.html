<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><title>Trip Review Tool</title>
<link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
<style>
 body{font-family:system-ui,Segoe UI,sans-serif;margin:0;background:#f7f8fa;color:#1f2430;
      display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px 0}
 .wrap{display:flex;flex-direction:column;gap:18px;width:440px}
 .card{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:32px 36px;
       box-shadow:0 4px 24px rgba(0,0,0,.05)}
 h1{font-size:20px;margin:0 0 4px}
 h2{font-size:16px;margin:0 0 12px}
 p.sub{color:#667085;margin:0 0 22px;font-size:14px}
 #drop{border:2px dashed #cbd2dc;border-radius:12px;aspect-ratio:1/1;padding:18px;
       display:flex;align-items:center;justify-content:center;text-align:center;
       color:#667085;cursor:pointer;transition:.15s}
 #drop.over{border-color:#3b82f6;background:#eff5ff;color:#3b82f6}
 #drop b{color:#1f2430}
 .browse{color:#3b82f6;font-weight:600;text-decoration:underline}
 #drop.over .browse{color:inherit}
 #name{margin-top:14px;font-size:13px;color:#1f2430;min-height:18px}
 button{margin-top:18px;width:100%;padding:10px;border:0;border-radius:9px;background:#3b82f6;
        color:#fff;font-size:15px;font-weight:600;cursor:pointer}
 button:disabled{background:#aac4f5;cursor:default}
 input[type=file]{display:none}
 /* resume list */
 .recent-row{display:flex;align-items:stretch;gap:6px;margin-bottom:8px}
 .recent-row:last-child{margin-bottom:0}
 .recent-link{flex:1 1 auto;display:flex;flex-direction:column;gap:2px;padding:10px 12px;
   border:1px solid #e4e7ec;border-radius:9px;text-decoration:none;color:#1f2430;transition:.12s}
 .recent-link:hover{border-color:#3b82f6;background:#f5f9ff}
 .recent-name{font-weight:600;font-size:14px;word-break:break-all}
 .recent-meta{font-size:12px;color:#667085}
 .recent-lastview{font-size:12px;color:#3b82f6;font-weight:500}
 .recent-del{margin-top:0;width:auto;flex:0 0 auto;background:#fff;color:#98a2b3;
   border:1px solid #e4e7ec;border-radius:9px;padding:0 13px;font-size:14px;font-weight:600}
 .recent-del:hover{color:#c0392b;border-color:rgba(220,60,60,.5);background:rgba(220,60,60,.06)}
 /* duplicate popup */
 .modal{position:fixed;inset:0;background:rgba(15,18,25,.45);display:flex;align-items:center;
   justify-content:center;z-index:50}
 .modal-box{background:#fff;border-radius:14px;padding:24px 26px;width:380px;
   box-shadow:0 12px 40px rgba(0,0,0,.2)}
 .modal-box h2{margin:0 0 8px}
 .modal-box p{color:#475467;font-size:14px;margin:0 0 18px;line-height:1.4}
 .modal-acts{display:flex;gap:10px;flex-wrap:wrap}
 .modal-acts button{margin-top:0;width:auto;flex:1 1 auto;padding:9px;border:1px solid #d0d5dd;font-size:14px}
 .modal-acts .primary{background:#3b82f6;border-color:#3b82f6;color:#fff}
 .modal-acts .ghost{background:#fff;color:#344054}
 .modal-acts .ghost:hover{background:#f2f4f7}
 .modal-acts .danger{background:#c0392b;border-color:#c0392b;color:#fff}
</style></head><body>
<div class="wrap">
 <div class="card">
  <h1>Trip Review Tool</h1>
  <p class="sub">Drop a raw trip workbook (.xlsx) to load proposals.</p>
  <form id="form">
   <label id="drop" for="file">
    <div>Drag &amp; drop a <b>.xlsx</b> here<br>or click to <span class="browse">browse</span></div>
   </label>
   <input type="file" id="file" name="file" accept=".xlsx">
   <div id="name"></div>
   <button id="go" type="submit" disabled>Load proposals</button>
  </form>
 </div>
 <div class="card" id="recentCard" style="display:none">
  <h2>Resume a session</h2>
  <div id="recent"></div>
 </div>
 <div class="card">
  <h2>Generate distributions</h2>
  <input type="file" id="distFile" accept=".xlsx" style="display:block;margin-bottom:10px">
  <button id="distGo" type="button" disabled>Generate charts</button>
 </div>
</div>

<div id="dupModal" class="modal" style="display:none">
 <div class="modal-box">
  <h2>Session already exists</h2>
  <p id="dupMsg"></p>
  <div class="modal-acts">
   <button id="dupResume" class="primary">Resume existing</button>
   <button id="dupNew" class="ghost">Start new</button>
   <button id="dupCancel" class="ghost">Cancel</button>
  </div>
 </div>
</div>

<div id="delModal" class="modal" style="display:none">
 <div class="modal-box">
  <h2>Delete session?</h2>
  <p id="delMsg"></p>
  <div class="modal-acts">
   <button id="delYes" class="danger">Delete</button>
   <button id="delNo" class="ghost">Cancel</button>
  </div>
 </div>
</div>

<script>
 const $=id=>document.getElementById(id);
 const drop=$('drop'), file=$('file'), name=$('name'), go=$('go'), form=$('form');

 function show(){const f=file.files[0]; if(f){name.textContent=f.name; go.disabled=false;}}
 file.onchange=show;
 ['dragenter','dragover'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add('over');}));
 ['dragleave','drop'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove('over');}));
 drop.addEventListener('drop',ev=>{file.files=ev.dataTransfer.files; show();});

 function busy(on){go.disabled=on; go.textContent=on?'Loading…':'Load proposals';}
 function postUpload(forceNew){
  const fd=new FormData(); fd.append('file', file.files[0]);
  if(forceNew) fd.append('force_new','1');
  return fetch('/upload',{method:'POST',body:fd});
 }
 async function handle(res){
  if(!res.ok){alert('Could not process workbook.'); busy(false); return;}
  const d=await res.json();
  if(d.duplicate){busy(false); openDup(d); return;}
  window.location = d.redirect || ('/s/'+d.sid);
 }
 form.addEventListener('submit', async ev=>{
  ev.preventDefault(); if(!file.files[0]) return;
  busy(true); handle(await postUpload(false));
 });

 // --- duplicate popup: resume the existing session or fork a fresh one ---
 const dupModal=$('dupModal'); let dupExisting=null;
 function openDup(d){
  dupExisting=d.existing;
  $('dupMsg').textContent=`A session for “${d.raw_name}” already exists. Resume where you left off, or start a brand-new session for the same file?`;
  dupModal.style.display='flex';
 }
 $('dupResume').onclick=()=>{window.location='/s/'+dupExisting;};
 $('dupNew').onclick=async ()=>{dupModal.style.display='none'; busy(true); handle(await postUpload(true));};
 $('dupCancel').onclick=()=>{dupModal.style.display='none';};

 // --- recent sessions list ---
 fetch('/api/sessions').then(r=>r.json()).then(list=>{
  if(!list || !list.length) return;
  $('recent').innerHTML = list.map(s=>{
   const c=s.counts||{};
   const when=new Date(s.modified).toLocaleString();
   const meta=`${when} · ${s.n_events} action${s.n_events===1?'':'s'}`+
              (c.person_days?` · ${c.person_days} person-days`:'');
   const lv=s.last_viewed;
   const lastOn=lv ? `<span class="recent-lastview">Last worked on: ${lv.day_key.split('|')[0]} · ${lv.day_key.split('|')[1]}</span>` : '';
   return `<div class="recent-row" data-sid="${s.sid}">`+
          `<a class="recent-link" href="/s/${s.sid}"><span class="recent-name">${s.raw_name}</span>`+
          `<span class="recent-meta">${meta}</span>${lastOn}</a>`+
          `<button class="recent-del" title="Delete this session">✕</button></div>`;
  }).join('');
  $('recentCard').style.display='';
  $('recent').querySelectorAll('.recent-row').forEach((row,i)=>{
   row.querySelector('.recent-del').onclick=()=>openDel(list[i].sid, list[i].raw_name);
  });
 }).catch(()=>{});

 // --- delete a session (with confirm) ---
 let delSid=null;
 function openDel(sid, rawName){
  delSid=sid;
  $('delMsg').textContent=`Permanently delete the session for “${rawName}”? This removes the raw file and every review decision, and cannot be undone.`;
  $('delModal').style.display='flex';
 }
 $('delNo').onclick=()=>{$('delModal').style.display='none';};
 $('delYes').onclick=async ()=>{
  $('delModal').style.display='none';
  const r=await fetch('/api/'+delSid+'/delete',{method:'POST'});
  if(!r.ok){alert('Could not delete session.'); return;}
  const row=document.querySelector(`.recent-row[data-sid="${delSid}"]`);
  if(row) row.remove();
  if(!$('recent').children.length) $('recentCard').style.display='none';
 };

 // --- distributions charts from an already-cleaned file (no session) ---
 const distFile=$('distFile'), distGo=$('distGo');
 distFile.onchange=()=>{distGo.disabled=!distFile.files[0];};
 distGo.onclick=async ()=>{
  if(!distFile.files[0]) return;
  distGo.disabled=true; distGo.textContent='Building…';
  const fd=new FormData(); fd.append('file', distFile.files[0]);
  try{
   // Same desktop-window download limitation as the main upload flow doesn't
   // hit (that one navigates to a new page instead of downloading a file) --
   // this one produces a file, so it needs the same pywebview Save As path
   // the session-side "Generate export"/"Distributions" buttons use.
   if(window.pywebview && window.pywebview.api){
    const res=await fetch('/api/distributions/from_file/build',{method:'POST',body:fd});
    if(!res.ok){alert(await res.text()); return;}
    const {path}=await res.json();
    const r=await window.pywebview.api.save_distributions_from_path(path);
    if(r.ok) alert(`Saved to ${r.path}`);
    else if(!r.cancelled) alert(`Save failed: ${r.error}`);
   } else {
    const res=await fetch('/api/distributions/from_file',{method:'POST',body:fd});
    if(!res.ok){alert(await res.text()); return;}
    const blob=await res.blob();
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download='trip_review_distributions.zip'; a.click();
   }
  } finally {
   distGo.disabled=false; distGo.textContent='Generate charts';
  }
 };
</script>
</body></html>
