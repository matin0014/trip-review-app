[project]
name = "trip-review-app"
version = "0.1.0"
description = "Interactive trip-cleaning review tool (local Flask + PyInstaller)"
requires-python = ">=3.9"

[tool.pytest.ini_options]
# Make `import engine...` work without an editable install.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: end-to-end tests that touch real data files (deselect with -m 'not integration')",
]
